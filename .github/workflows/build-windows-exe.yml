name: Build Windows PC Executable (.exe)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables (.exe Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows-EXE
          path: dist-electron/*.exe

      - name: Create Continuous Release (.exe Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lab X Studio v1.4.0 (Windows .exe)"
          body: |
            ## Lab X Studio v1.4.0 — Windows Executables (.exe)
            
            - **Installer**: `Lab-X-Studio-Setup-1.4.0.exe` (Complete Windows installation with Desktop shortcut)
            - **Portable**: `Lab-X-Studio-Portable-1.4.0.exe` (Run directly without installing)
            
            ### What's New in v1.4.0:
            - **Dedicated Settings Tab (⚙️)**: Moved page margins and print layout into a clean, dedicated Settings tab.
            - **Default Margins**: Set to 40mm (Top letterhead spacer), 14mm (Side margins), and 8mm (Bottom margin).
            - **4 Workspace Color Themes**: Dark Workstation, Clinical Light, Midnight Navy, and Emerald Green.
            - **Conditional Auto-Update**: Update popup only triggers when a newer release is actually available on GitHub.
            - **Custom Report Sheet Builder from Scratch**: Create brand new diagnostic sheets from scratch (e.g., Urine Examination, Dengue Serology, Stool, etc.) with custom parameter rows and remarks.
            - **Permanent Settings**: Clinic details, signatures, margins, and themes persist across app restarts.
            
            Automatically compiled by GitHub Actions.
          files: dist-electron/*.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
