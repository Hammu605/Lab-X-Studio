name: Build Cross-Platform PC Release (Windows .exe & Linux .AppImage)

on:
  push:
    branches: [ master, main, beta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: dist-electron/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Ultra-Lightweight Linux Packages (.deb & .tar.gz)
        run: python3 scripts/build_linux_lite.py

      - name: Build Linux .AppImage & .deb
        run: pnpm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: release-dist

      - name: List Release Files
        run: ls -lh release-dist

      - name: Clean Old Release Assets
        run: |
          for asset in $(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true); do
            echo "Removing old asset $asset..."
            gh release delete-asset latest "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Continuous Release (Windows .exe & Linux .AppImage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lab X Studio v1.1.2 (Official Stable Release)"
          body: |
            ## Lab X Studio v1.1.2 — Official Cross-Platform Release (Windows & Linux)

            ### 📦 Download Links:
            - **⚡ Linux Ultra-Lite Installer (Recommended for Kali Linux / Debian / Ubuntu)**: `Lab-X-Studio-Linux-Lite-1.1.2.deb` (**Only ~48 KB!** Auto-maximizes to screen, instant install with Desktop shortcut via `sudo dpkg -i`)
            - **⚡ Linux Ultra-Lite Portable**: `Lab-X-Studio-Linux-Portable-1.1.2.tar.gz` (**Only ~67 KB!** Extract and run `./run.sh` anywhere without installing)
            - **Linux Self-Contained AppImage**: `Lab-X-Studio-1.1.2.AppImage` (Bundled standalone runtime)
            - **Windows Installer**: `Lab-X-Studio-Setup-1.1.2.exe` (Complete Windows installation with Desktop shortcut)
            - **Windows Portable**: `Lab-X-Studio-Portable-1.1.2.exe` (Standalone portable execution without installation)

            ### 🚀 What's New in v1.1.2:
            - **1-Click Update & Restart Launcher**: After downloading Windows Setup `.exe`, clicking the button automatically launches the installer from Downloads and cleanly closes the old running version so Windows NSIS can update without file-lock issues.
            - **Independent Pre-default Test Checkboxes**: Fixed CBC unchecking bug so users can freely check or uncheck CBC or any test without forced rechecking.
            - **Custom Template Checkboxes & DOM Restoration**: Added clean checkboxes to every custom Scratch & Uploaded report; clicking or toggling restores and displays sheets seamlessly on canvas and print layouts.
            - **Strict Scratch vs. Uploaded Classification**: Fixed uploaded reports being categorized under scratch by strictly scoping the active sheet ID and type.
            - **Removed Hindi Badge Boxes**: Replaced badges with clean, minimal layout `[Checkbox] [Report Name] [JSON Export] [Delete]`.
            - **Delete Confirmation Modal**: Custom styled modal protects custom templates from accidental deletion.
            - **Complete Clinic & DMLT Signatures on Scratch Reports**: Scratch reports created from blank or multi-page now include the 3-column DMLT staff signature and bottom clinic footer line (`Electronic Diagnostic Report • KRISHNA COMPUTERIZED LABORATORY • End of Report`).
            - **WordPad Typography Font Sizes (10, 11, 13) & Robust Formatting**: Full support for font size buttons (10, 11, 13), Bold, Italic, Underline, and custom colors on selected text or focused editable cells.

            Automatically compiled by GitHub Actions.
          files: release-dist/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
