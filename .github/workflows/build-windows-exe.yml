name: Build Windows PC Executable (.exe)

on:
  push:
    branches: [ master, main, beta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables (.exe Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows-EXE
          path: dist-electron/*.exe

      - name: Create Continuous Release (.exe Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lab X Studio v1.5.0 (Windows .exe)"
          body: |
            ## Lab X Studio v1.5.0 — Windows Executables (.exe)
            
            - **Installer**: `Lab-X-Studio-Setup-1.5.0.exe` (Complete Windows installation with Desktop shortcut)
            - **Portable**: `Lab-X-Studio-Portable-1.5.0.exe` (Run directly without installing)
            
            ### What's New in v1.5.0:
            - **12 Full Pathology Diagnostic Panels**: Complete Blood Count (CBC, 34 Parameters with reactive WBC/RBC/PLT Histograms), LFT, KFT, Vitamins, Notes, Diabetes HbA1c, Free Thyroid (FT3/FT4/TSH), Hematology Summary, Lipid Profile, ASCVD Risk Matrix, Glucose Sign-Off, and Hepatitis C Virus (HCV) Card Test.
            - **Top Sticky Ribbon WordPad Toolbar**: Microsoft Word / Google Docs style ribbon docked above sheets for formatting (B/I/U/S, sizes, colors, alignments) and structure additions (+Row, +Group, +Note Box, +Sub-Header).
            - **Direct Report File Uploader**: Instant client-side parser for `.doc`, `.docx`, and `.pdf` files that generates editable A4 pathology cards.
            - **Local Database Auto-Save & Backup**: Real-time auto-saving with one-click `.json` backup file export and restore.
            - **Default Unchecked Checkboxes**: Clean workstation start with Select All (12) and Clear All quick actions.
            
            Automatically compiled by GitHub Actions.
          files: dist-electron/*.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
