name: Build Cross-Platform PC Release (Windows .exe & Linux .AppImage)

on:
  push:
    branches: [ master, main, beta, testing ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: dist-electron/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Ultra-Lightweight Linux Packages (.deb & .tar.gz)
        run: python3 scripts/build_linux_lite.py

      - name: Build Linux .AppImage & .deb
        run: pnpm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: release-dist

      - name: List Release Files
        run: ls -lh release-dist

      - name: Configure Release Metadata
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "testing" ]; then
            echo "tag=v1.1.3-beta" >> $GITHUB_OUTPUT
            echo "title=Lab X Studio v1.1.3-beta (Testing Release - Firebase Sync)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Lab X Studio v1.1.2 (Official Stable Release)" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Clean Old Release Assets
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            echo "Removing old asset $asset from release $TAG..."
            gh release delete-asset "$TAG" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Continuous Release (Windows .exe & Linux Packages)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ## ${{ steps.meta.outputs.title }}

            ### 📦 Download Links:
            - **⚡ Linux Ultra-Lite Installer (Recommended for Kali Linux / Debian / Ubuntu)**: `Lab-X-Studio-Linux-Lite-1.1.3-beta.deb` (Instant install with Desktop shortcut via `sudo dpkg -i`)
            - **⚡ Linux Ultra-Lite Portable**: `Lab-X-Studio-Linux-Portable-1.1.3-beta.tar.gz` (Extract and run `./run.sh` anywhere without installing)
            - **Windows Installer**: `Lab-X-Studio-Setup-1.1.3-beta.exe` (Complete Windows installation with Desktop shortcut)
            - **Windows Portable**: `Lab-X-Studio-Portable-1.1.3-beta.exe` (Standalone portable execution without installation)
            - **Linux Self-Contained AppImage**: `Lab-X-Studio-1.1.3-beta.AppImage`

            ### 🚀 Highlights in v1.1.3-beta:
            - **Firebase Firestore Multi-PC Live Sync**: Real-time patient records & custom templates cloud backup and synchronization across multiple lab computers.
            - **Offline-First Hybrid Engine**: Works 100% offline seamlessly using local database vault with zero lag; syncs automatically as soon as internet is restored.
            - **Live Public QR Code Verification**: Standard scannable QR stamp embedded on all report sheets, linking to `https://lab-x-studio.web.app/verify.html` for instant smartphone verification.
            - **Cloud Sync Status Badge**: Live visual indicator in top header bar showing connection state (🟢 Cloud Live, 🟡 Offline Vault, 🔄 Syncing).

            Automatically compiled by GitHub Actions from `${{ github.ref_name }}` branch.
          files: release-dist/*
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
