name: Build Cross-Platform PC Release (Windows .exe & Linux .AppImage)

on:
  push:
    branches: [ master, main, beta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: dist-electron/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Ultra-Lightweight Linux Packages (.deb & .tar.gz)
        run: python3 scripts/build_linux_lite.py

      - name: Build Linux .AppImage & .deb
        run: pnpm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: release-dist

      - name: List Release Files
        run: ls -lh release-dist

      - name: Create Continuous Release (Windows .exe & Linux .AppImage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lab X Studio v1.5.1 (Windows & Linux Ultra-Lite)"
          body: |
            ## Lab X Studio v1.5.1 — Cross-Platform Release (Windows & Linux)

            ### 📦 Download Links:
            - **⚡ Linux Ultra-Lite Installer (Recommended for Kali Linux / Debian / Ubuntu)**: `Lab-X-Studio-Linux-Lite-1.5.1.deb` (**Only ~48 KB!** Instant install with Desktop shortcut via `sudo dpkg -i`)
            - **⚡ Linux Ultra-Lite Portable**: `Lab-X-Studio-Linux-Portable-1.5.1.tar.gz` (**Only ~67 KB!** Extract and run `./run.sh` anywhere without installing)
            - **Linux Self-Contained AppImage**: `Lab-X-Studio-1.5.1.AppImage` (Bundled standalone runtime)
            - **Windows Installer**: `Lab-X-Studio-Setup-1.5.1.exe` (Complete Windows installation with Desktop shortcut)
            - **Windows Portable**: `Lab-X-Studio-Portable-1.5.1.exe` (Standalone portable execution without installation)

            ### 🚀 What's New & Fixed in v1.5.1:
            - **Ultra-Lightweight Linux Package**: Reduced Linux package size from 104 MB down to **48 KB** (over 2,000x smaller!) using native system app window engine.
            - **Fixed Startup Freeze & Hang**: Eliminated infinite recursion loop on checkbox toggles and page load. App starts instantly and buttons remain responsive.
            - **Comprehensive Multi-Parameter DOC/DOCX Parser**: Uploading clinical biochemistry files now accurately extracts all 10–20+ parameters (investigation, observed value, unit, reference interval, and range gauge) instead of stopping at 1.
            - **Dynamic Clinic Header Inheritance**: Uploaded custom reports now inherit the user's active laboratory name, address, and doctor/technician signature stamps.
            - **40mm Top Letterhead Spacer**: Restored the 40mm preprinted letterhead spacer on all custom and uploaded sheets.
            - **Dual-Boot Ready**: Tested and packaged for seamless operation on Windows and Kali Linux from shared partitions.

            Automatically compiled by GitHub Actions.
          files: release-dist/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
