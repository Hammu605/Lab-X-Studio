name: Build Cross-Platform PC Release (Windows .exe & Linux .AppImage)

on:
  push:
    branches: [ master, main, beta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows .exe Installer & Portable
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: dist-electron/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Ultra-Lightweight Linux Packages (.deb & .tar.gz)
        run: python3 scripts/build_linux_lite.py

      - name: Build Linux .AppImage & .deb
        run: pnpm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Windows
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lab-X-Studio-Linux
          path: release-dist

      - name: List Release Files
        run: ls -lh release-dist

      - name: Clean Old Release Assets
        run: |
          for asset in $(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true); do
            echo "Removing old asset $asset..."
            gh release delete-asset latest "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Continuous Release (Windows .exe & Linux .AppImage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lab X Studio v1.1.0 (Official Stable Release)"
          body: |
            ## Lab X Studio v1.1.0 — Official Cross-Platform Release (Windows & Linux)

            ### 📦 Download Links:
            - **⚡ Linux Ultra-Lite Installer (Recommended for Kali Linux / Debian / Ubuntu)**: `Lab-X-Studio-Linux-Lite-1.1.0.deb` (**Only ~48 KB!** Auto-maximizes to screen, instant install with Desktop shortcut via `sudo dpkg -i`)
            - **⚡ Linux Ultra-Lite Portable**: `Lab-X-Studio-Linux-Portable-1.1.0.tar.gz` (**Only ~67 KB!** Extract and run `./run.sh` anywhere without installing)
            - **Linux Self-Contained AppImage**: `Lab-X-Studio-1.1.0.AppImage` (Bundled standalone runtime)
            - **Windows Installer**: `Lab-X-Studio-Setup-1.1.0.exe` (Complete Windows installation with Desktop shortcut)
            - **Windows Portable**: `Lab-X-Studio-Portable-1.1.0.exe` (Standalone portable execution without installation)

            ### 🚀 What's New in v1.1.0:
            - **Table # Column Quick-Add Button**: Direct `+` icon on every table header to insert Parameter Rows, Section Headers, Sub-Header Bars, or Notes with 1 click.
            - **Save Buttons Clarified with Subtitles**: Transparent, clear English subtitles on every Save button (Save Report, Save to Library, Export Backup) so there is zero confusion.
            - **Dedicated Scratch & Upload Sections**: Distinct sections with badges (`Scratch से बना हुआ`, `Upload से बना हुआ`), prompt for report title on creation/upload, and instant `[Export JSON]` button for every template.
            - **Universal Report Search**: Instant real-time search across Pre-Default, Scratch, and Uploaded clinical modules simultaneously.
            - **Rock-Solid WordPad Formatter**: Reliable Bold, Italic, Underline, and Color formatting on selected text or active cells.
            - **Full Restart & Reload Persistence**: Every custom report, template, patient record, and table modification reloads seamlessly upon app restart.

            Automatically compiled by GitHub Actions.
          files: release-dist/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
